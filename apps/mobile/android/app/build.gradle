apply plugin: 'com.android.application'

android {
    namespace "ir.carpart.app"
    compileSdk rootProject.ext.compileSdkVersion
    // نسخه‌بندی از package.json ریشه (دارایی واحد نسخه) — با fallback امن
    def rootPackageJsonFile = file('../../../../package.json')
    def rootVersion = '1.0.0'
    if (rootPackageJsonFile.exists()) {
        try {
            rootVersion = new groovy.json.JsonSlurper().parseText(rootPackageJsonFile.text).version ?: '1.0.0'
        } catch (Exception ignored) {
            rootVersion = '1.0.0'
        }
    }
    def vParts = rootVersion.tokenize('.')
    def vMajor = vParts.size() > 0 && vParts[0].isInteger() ? vParts[0].toInteger() : 1
    def vMinor = vParts.size() > 1 && vParts[1].isInteger() ? vParts[1].toInteger() : 0
    def vPatch = vParts.size() > 2 && vParts[2].isInteger() ? vParts[2].toInteger() : 0
    def versionCodeNumber = vMajor * 10000 + vMinor * 100 + vPatch

    defaultConfig {
        applicationId "ir.carpart.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeNumber
        versionName rootVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // امضای نسخه انتشار: اگر متغیرهای CARPART_KEYSTORE_* تنظیم شده باشند از keystore
    // واقعی استفاده می‌شود؛ وگرنه خروجی release با کلید debug امضا می‌شود (فقط برای آزمایش).
    def keystorePath = System.getenv('CARPART_KEYSTORE_FILE')
    signingConfigs {
        release {
            if (keystorePath != null && !keystorePath.isEmpty()) {
                storeFile file(keystorePath)
                storePassword System.getenv('CARPART_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CARPART_KEY_ALIAS')
                keyPassword System.getenv('CARPART_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig keystorePath != null && !keystorePath.isEmpty() ? signingConfigs.release : signingConfigs.debug
        }
    }
    // چهار Flavor اندروید از یک کدبیس مشترک: مکانیک، پیک، فروشنده و مدیریت.
    // هر چهار خروجی از وب‌اپ بهینه‌شدهٔ مشترک استفاده می‌کنند و مجوز نقش در API کنترل می‌شود.
    flavorDimensions "role"
    productFlavors {
        mechanic {
            dimension "role"
            applicationId "ir.carpart.app.mechanic"
            versionNameSuffix "-mechanic"
        }
        courier {
            dimension "role"
            applicationId "ir.carpart.app.courier"
            versionNameSuffix "-courier"
        }
        seller {
            dimension "role"
            applicationId "ir.carpart.app.seller"
            versionNameSuffix "-seller"
        }
        admin {
            dimension "role"
            applicationId "ir.carpart.app.admin"
            versionNameSuffix "-admin"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
