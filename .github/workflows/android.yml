name: ساخت اپلیکیشن اندروید قطعه‌رسان (APK)

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'releases/**'
  pull_request:
    branches: ['main']
    paths-ignore:
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: کامپایل و امضای بسته نصبی اندروید (Signed APK)
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد منبع
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: راه‌اندازی Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: راه‌اندازی Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: پذیرش مجوزهای Android SDK برای دانلود خودکار SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: نصب وابستگی‌ها و همگام‌سازی Capacitor Android
        run: |
          npm ci
          npm run build -w @carpart/contract
          npm run android:sync

      - name: آماده‌سازی کلید امضای دیجیتال APK
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/carpart-release.p12"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          else
            keytool -genkeypair \
              -v \
              -storetype PKCS12 \
              -keystore "$KEYSTORE_FILE" \
              -alias carpart \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "CarPartRelease2026!" \
              -keypass "CarPartRelease2026!" \
              -dname "CN=CarPart Iran, OU=Mobile Engineering, O=CarPart, L=Tehran, ST=Tehran, C=IR"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=CarPartRelease2026!" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=carpart" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=CarPartRelease2026!" >> "$GITHUB_ENV"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: ساخت نسخه نهایی امضاشده (assembleRelease) با Gradle
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: بررسی امضای دیجیتال APK و آماده‌سازی پوشه انتشار
        run: |
          APK_SOURCE="apps/web/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_SOURCE"
          mkdir -p releases
          cp "$APK_SOURCE" releases/carpart-v0.1.0-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose releases/carpart-v0.1.0-release.apk
          (cd releases && sha256sum carpart-v0.1.0-release.apk > SHA256SUMS.txt)
          ls -lh releases/

      - name: بارگذاری فایل نصبی APK در خروجی بیلد
        uses: actions/upload-artifact@v4
        with:
          name: carpart-android-apk
          path: |
            releases/carpart-v0.1.0-release.apk
            releases/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: ذخیره بسته نصبی در شاخه و انتشار در GitHub Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${{ github.ref_name }}"
          git add -f releases/carpart-v0.1.0-release.apk releases/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): publish compiled signed Android APK v0.1.0 [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          gh release upload v0.1.0 releases/carpart-v0.1.0-release.apk releases/SHA256SUMS.txt --clobber || \
          gh release create v0.1.0 releases/carpart-v0.1.0-release.apk releases/SHA256SUMS.txt \
            --target "${{ github.ref_name }}" \
            --title "اپلیکیشن اندروید قطعه‌رسان نسخه ۰.۱.۰ (CarPart Android APK v0.1.0)" \
            --notes "بسته نصبی رسمی و امضاشده اندروید قطعه‌رسان (Package ID: ir.carpart.app — حداقل اندروید ۷.۰ به بالا)."
